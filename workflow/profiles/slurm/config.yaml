# Snakemake SLURM executor profile (same settings as the WGS_variant_pipeline repo).
# Works with snakemake >= 8.x and snakemake-executor-plugin-slurm.
# Use with: snakemake --profile workflow/profiles/slurm

# ── Execution ─────────────────────────────────────────────────────────
executor: slurm
jobs: 100                        # max concurrent SLURM jobs
latency-wait: 60                 # seconds to wait for output files after job ends (xdisk NFS lag)
rerun-incomplete: true
# Only rerun a job when an input is newer than its output (see the WGS repo's profile for why:
# default triggers redo days of work after a harmless rule edit). To force a rerun after editing a
# rule, delete that rule's outputs.
rerun-triggers: [mtime]
keep-going: true
restart-times: 2                 # auto-retry failed jobs twice (transient HPC I/O errors)

# ── Default SLURM resources (overridden per rule in rules/*.smk) ──────
default-resources:
  slurm_partition: "standard"
  slurm_account: "haining"
  mem_mb: 8000
  runtime: 60                    # minutes
  cpus_per_task: 2

# ── Output ────────────────────────────────────────────────────────────
printshellcmds: true
show-failed-logs: true
